<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Teaching feedback · Outcome1</title>
<link rel="icon" href="outcome2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F3EE;--card:#FFFFFF;--soft:#FAF9F5;--text:#1E1E1E;--dim:#6B6862;--line:#E6E3DA;--line2:#CFCABE;
  --ink:#1E1E1E;--ink-fg:#F4F3EE;--edge:#1E1E1E;--red:#AE3F2C;
  --c1:#C8BFF1;--c2:#F4B683;--c3:#A3EEF2;--c4:#EE9F98;--c5:#D3F69C;
  --font:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121212;--card:#1C1C1B;--soft:#232321;--text:#F4F3EE;--dim:#A19D94;--line:#2F2F2C;--line2:#46453F;--ink:#F4F3EE;--ink-fg:#121212;--edge:#46453F;--red:#F0A090}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:500 16px/1.5 var(--font);-webkit-text-size-adjust:100%}
.wrap{max-width:600px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font:800 21px var(--font);letter-spacing:-.045em}
.pill{font:700 12px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border:1.5px solid var(--line2);border-radius:99px;padding:6px 12px}
.hero{background:var(--c1);color:#1E1E1E;border:2px solid #1E1E1E;border-radius:30px;padding:22px 22px 24px}
.kick{font:700 12.5px var(--font);letter-spacing:.09em;text-transform:uppercase;opacity:.75}
h1{font:800 32px/1.05 var(--font);letter-spacing:-.04em;margin:8px 0 10px;overflow-wrap:anywhere}
.meta{font:600 15.5px/1.4 var(--font);color:#3A3836}
.note{font:500 15px/1.5 var(--font);color:var(--dim);margin:16px 4px 22px}
form{display:grid;gap:14px}
.q{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px}
.q label{display:flex;gap:12px;align-items:flex-start;font:700 16.5px/1.35 var(--font);letter-spacing:-.01em;margin-bottom:12px}
.q .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--font);color:#1E1E1E;background:var(--c);border:2px solid #1E1E1E}
textarea{-webkit-appearance:none;appearance:none;width:100%;min-height:96px;resize:vertical;border:1.5px solid var(--line2);border-radius:16px;background:var(--soft);color:var(--text);font:500 16px/1.45 var(--font);padding:12px 14px}
textarea:focus{outline:3px solid var(--text);outline-offset:1px;border-color:var(--text)}
.err{color:var(--red);font:600 15px/1.4 var(--font);min-height:1.4em;margin:2px 4px 0}
.go{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;text-align:center;background:var(--ink);color:var(--ink-fg);border-radius:999px;padding:19px;font:700 18px var(--font)}
.go:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.go[disabled]{opacity:.55;cursor:wait}
.state{background:var(--card);border:1px solid var(--line);border-radius:30px;padding:34px 22px;text-align:center}
.state h2{font:800 28px/1.1 var(--font);letter-spacing:-.035em;margin:16px 0 8px}
.state p{margin:0 auto;max-width:28em;color:var(--dim)}
.badge{width:76px;height:76px;border-radius:50%;display:inline-grid;place-items:center;border:2px solid #1E1E1E;color:#1E1E1E;background:var(--c5);font:800 30px var(--font)}
.badge.warn{background:var(--c2)}
.link{all:unset;cursor:pointer;display:inline-block;margin-top:18px;font:700 15px var(--font);color:var(--text);text-decoration:underline;text-underline-offset:3px}
.link:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.load{color:var(--dim);text-align:center;padding:60px 0}
.foot{text-align:center;color:var(--dim);font:500 13px var(--font);margin-top:28px}
@media (max-width:380px){h1{font-size:28px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="brand">Outcome1</span><span class="pill">Teaching feedback</span></div>
  <main id="main" aria-live="polite"><div class="load">Loading the form…</div></main>
  <div class="foot">Anonymous · no sign-in needed</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, push, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey:            "AIzaSyB3sTHvcD-U_c5Jt5Uveg3xJ1MUxj4vfTQ",
  authDomain:        "gimtrack-dfecb.firebaseapp.com",
  databaseURL:       "https://gimtrack-dfecb-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "gimtrack-dfecb",
  storageBucket:     "gimtrack-dfecb.firebasestorage.app",
  messagingSenderId: "275166300125",
  appId:             "1:275166300125:web:d17b25586221f913ced834",
};
// The JRCPTB "Evaluation form for teaching and presentations" questions, same keys the app reads
const QUESTIONS = [
  { k:'setting',    q:'Session setting, facilities etc' },
  { k:'objectives', q:'Were the objectives of the session identified and were these met?' },
  { k:'delivery',   q:'Was the delivery effective and clear? If handouts were used, were these useful?' },
  { k:'useful',     q:'What aspects of the session were useful i.e. were there learning and change of practice points?' },
  { k:'other',      q:'Any other comments?' }
];
const COLOURS = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];
const MAX = 2000;

const db = getDatabase(initializeApp(firebaseConfig));
const sid = (new URLSearchParams(location.search).get('s') || '').trim();
const main = document.getElementById('main');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when = d => { const x = new Date(d + 'T00:00:00'); return isNaN(x) ? '' : x.toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' }); };
const doneKey = 'o1fb_sent_' + sid;
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };

function state(badge, title, text, extra){
  main.innerHTML = `<div class="state"><span class="badge ${badge==='!'?'warn':''}" aria-hidden="true">${badge}</span><h2>${title}</h2><p>${text}</p>${extra||''}</div>`;
  document.title = title + ' · Outcome1';
}
const invalid = () => state('!', 'This link isn’t working', 'The feedback form couldn’t be found. Check you scanned the right QR code, or ask the presenter for the link again.');
const who = m => esc(m.presenter || 'the presenter');

function hero(m){
  const bits = [m.presenter, when(m.date), m.audience].filter(Boolean).map(esc).join(' · ');
  return `<section class="hero"><div class="kick">${esc(m.type || 'Teaching session')}</div><h1>${esc(m.topic || 'Teaching session')}</h1>${bits?`<div class="meta">${bits}</div>`:''}</section>`;
}

function showForm(m){
  document.title = 'Feedback: ' + (m.topic || 'teaching session') + ' · Outcome1';
  main.innerHTML = hero(m) +
    `<p class="note">About two minutes. Your name isn’t recorded, and only ${who(m)} can read the answers. Answer as many questions as you like.</p>
     <form id="fb" novalidate>
       ${QUESTIONS.map((q,i)=>`<div class="q"><label for="q-${q.k}"><span class="n" style="--c:${COLOURS[i]}">${i+1}</span><span>${esc(q.q)}</span></label><textarea id="q-${q.k}" name="${q.k}" maxlength="${MAX}" rows="3"></textarea></div>`).join('')}
       <p class="err" id="err" role="alert"></p>
       <button class="go" id="send" type="submit">Send feedback</button>
     </form>`;
  const form = document.getElementById('fb'), err = document.getElementById('err'), btn = document.getElementById('send');
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const answers = {};
    QUESTIONS.forEach(q => { const v = form.elements[q.k].value.trim().slice(0, MAX); if(v) answers[q.k] = v; });
    if(!Object.keys(answers).length){ err.textContent = 'Please answer at least one question before sending.'; form.elements[QUESTIONS[0].k].focus(); return; }
    err.textContent = ''; btn.disabled = true; btn.textContent = 'Sending…';
    const slow = setTimeout(() => { err.textContent = 'Taking longer than usual. Keep this page open and it will send when your connection is back.'; }, 10000);
    try{
      await set(push(ref(db, 'arcpFeedback/' + sid + '/responses')), { ...answers, ts: Date.now() });
      clearTimeout(slow); store.set(doneKey, String(Date.now())); thanks(m);
    }catch(e){
      clearTimeout(slow); btn.disabled = false; btn.textContent = 'Send feedback';
      err.textContent = /permission/i.test(String(e && e.message || e))
        ? 'This form isn’t accepting responses at the moment. Please let the presenter know.'
        : 'Couldn’t send your feedback. Check your connection and try again.';
    }
  });
}
function thanks(m){
  state('✓', 'Thank you', `Your feedback has been sent to ${who(m)}. You can close this page.`);
}
function already(m){
  state('✓', 'Feedback sent', `You’ve already sent feedback on this session from this device. Thank you.`, `<button class="link" id="again">Send another response</button>`);
  document.getElementById('again').addEventListener('click', () => showForm(m));
}

(async function start(){
  if(!/^[a-z0-9]{6,40}$/i.test(sid)) return invalid();
  let meta = null;
  try{
    const snap = await get(ref(db, 'arcpFeedback/' + sid + '/meta'));
    meta = snap.exists() ? snap.val() : null;
  }catch(e){
    return state('!', 'Couldn’t load the form', 'Check your connection, then reload this page.', `<button class="link" onclick="location.reload()">Reload</button>`);
  }
  if(!meta) return invalid();
  if(meta.open === false) return state('!', 'Feedback has closed', `${who(meta)} has stopped collecting feedback on “${esc(meta.topic || 'this session')}”. Thank you for wanting to help.`);
  if(store.get(doneKey)) return already(meta);
  showForm(meta);
})();
</script>
</body>
</html>
